name: CI Build

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web regression tests
        run: node --test tests/*.test.cjs

      - name: Worker dependencies
        run: npm ci --prefix notification-worker

      - name: Worker regression tests
        run: npm test --prefix notification-worker

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
