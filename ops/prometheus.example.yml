# Template: replace hosts, mount secrets, and validate with promtool before use.
# No credentials in Git. Create separate jobs/labels for staging and production.
global:
  scrape_interval: 60s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: pideya-worker
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pideya_metrics_token
    static_configs:
      - targets: ['pideya-notifications.onrender.com']
        labels:
          environment: production
  - job_name: supabase
    scheme: https
    metrics_path: /customer/v1/privileged/metrics
    basic_auth:
      username: username
      password_file: /run/secrets/supabase_metrics_key
    static_configs:
      - targets: ['REPLACE_PROJECT_REF.supabase.co:443']
        labels:
          environment: production
